server {
    listen 80;
    server_name _;

    client_max_body_size 66M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static text/js/css
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirect /api to /api/
    location = /api {
        return 301 /api/;
    }

    # API Reverse Proxy to Backend
    # Trailing slash strips '/api/' prefix so requests match FastAPI routes
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        client_max_body_size 66M;
    }

    # Cache immutable static build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single Page App routing: fallback to index.html for all portal deep links
    location / {
        try_files $uri $uri/ /index.html;
    }
}
