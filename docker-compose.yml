services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pub-attendeye-backend:latest
    container_name: attendeye-backend
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: true
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/attendeye.db}
      - PRIVATE_DIR=${PRIVATE_DIR:-/app/private}
      - MODEL_ROOT=${MODEL_ROOT:-/app/backend/models/insightface}
      - FACE_MODEL=${FACE_MODEL:-buffalo_l}
      - MINIFAS_PATH=${MINIFAS_PATH:-/app/backend/models/minifasnet.onnx}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - FERNET_KEY=${FERNET_KEY:?FERNET_KEY must be set}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-127.0.0.1,localhost,backend,127.0.0.1:8080,localhost:8080,127.0.0.1:8000,localhost:8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-2}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-2}
      - VECLIB_MAXIMUM_THREADS=${VECLIB_MAXIMUM_THREADS:-2}
      - NUMEXPR_NUM_THREADS=${NUMEXPR_NUM_THREADS:-2}
    volumes:
      - attendeye-data:/app/data
      - attendeye-private:/app/private
      - ./backend/models:/app/backend/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: 2.0
    mem_limit: 4g
    networks:
      - attendeye-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pub-attendeye-frontend:latest
    container_name: attendeye-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    networks:
      - attendeye-net

volumes:
  attendeye-data:
    name: attendeye-data
  attendeye-private:
    name: attendeye-private

networks:
  attendeye-net:
    name: attendeye-net
    driver: bridge
